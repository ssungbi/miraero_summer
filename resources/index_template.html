<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 미래로 써머 - 랭킹 인포그래픽 (9:16)</title>
  <style>
    @font-face {
      font-family: 'S-CoreDream';
      font-weight: 300;
      font-style: normal;
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-3Light.woff') format('woff');
    }
    @font-face {
      font-family: 'S-CoreDream';
      font-weight: 400;
      font-style: normal;
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff') format('woff');
    }
    @font-face {
      font-family: 'S-CoreDream';
      font-weight: 500;
      font-style: normal;
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff');
    }

    :root {
      --primary-emerald: #059669;
      --deep-emerald: #064e3b;
      --header-bg: #047857; 
      --header-text: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --disabled-bg: #f8fafc;
      --disabled-text: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #cbd5e1;
      font-family: 'S-CoreDream', -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .mobile-container {
      width: 450px;
      height: 800px;
      background: #ffffff; 
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      position: relative;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
    }

    .banner-wrapper {
      width: 100%;
      flex: 0 1 auto; 
      max-height: 380px; 
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: auto; 
      max-height: 100%; 
      object-fit: contain; 
      object-position: top; 
      display: block;
    }

    .table-section {
      padding: 4px 10px 8px 10px;
      flex: 1 0 auto; 
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
    }

    .ranking-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 2px;
      text-align: center;
      font-family: 'S-CoreDream', sans-serif;
    }

    .ranking-table th {
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 500;
      font-size: 11px;
      padding: 5px 2px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .ranking-table th:first-child {
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      width: 16%;
    }
    .ranking-table th:nth-child(2) { width: 32%; }
    .ranking-table th:last-child {
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      width: 52%;
    }

    .ranking-table tr.data-row {
      height: 19px; 
      background: #ffffff;
    }

    .ranking-table td {
      padding: 1px 2px;
      font-size: 13px;
      color: var(--text-main);
      text-align: center;
      vertical-align: middle;
    }

    .rank-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-weight: 300;
      font-size: 10px;
      background: #ffffff;
      color: var(--primary-emerald);
      border: 1px solid #a7f3d0;
    }

    .agent-name {
      font-weight: 400;
      font-size: 12px;
      color: var(--text-main);
    }

    .premium-amount {
      font-weight: 300;
      color: var(--deep-emerald);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .currency-symbol {
      font-weight: 300;
      font-size: 10px;
      color: var(--text-sub);
      margin-left: 2px;
    }

    tr.out-of-bounds {
      background: #f1f5f9 !important; 
    }
    tr.out-of-bounds .rank-num {
      background: transparent;
      color: var(--disabled-text);
      border: 1px solid #e2e8f0;
    }
    tr.out-of-bounds .agent-name { color: var(--disabled-text); }
    tr.out-of-bounds .premium-amount { color: var(--disabled-text); }
    tr.out-of-bounds td { border-bottom: 1px dashed #e2e8f0; }

    .date-info-bottom {
      text-align: right;
      font-family: 'S-CoreDream', sans-serif;
      font-weight: 300;
      font-size: 8px; 
      color: var(--text-sub);
      padding: 2px 6px 0 0;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="banner-wrapper">
      <!-- 로컬 이미지 로딩을 위해 상대경로 혹은 파일 URL 사용 (여기선 동일 폴더 기준) -->
      <img src="banner.png" alt="2026 미래로 써머 in 하노이 하롱베이" class="banner-img">
    </div>
    <div class="table-section">
      <table class="ranking-table">
        <thead>
          <tr>
            <th>순위</th>
            <th>FC</th>
            <th>보험료 합계</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          {DATA_ROWS}
        </tbody>
      </table>
      <div class="date-info-bottom">기준일 : {CURRENT_DATE}</div>
    </div>
  </div>
</body>
</html>
